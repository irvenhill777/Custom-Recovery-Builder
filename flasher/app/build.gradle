plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.bluejay.flasher'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.bluejay.flasher'
        minSdk 31
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Debug signing keeps CI release artifacts installable.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
