name: Build Flasher APK

on:
  workflow_dispatch:
    inputs:
      BUILD_TYPE:
        description: "APK build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
  push:
    paths:
      - "flasher/**"
      - ".github/workflows/Build-Flasher-APK.yml"

permissions:
  contents: read

concurrency:
  group: flasher-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Bluejay Recovery Flasher APK
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platform and build tools
        run: |
          set -eo pipefail
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" | tail -n 20

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: flasher
        run: |
          set -eo pipefail

          if [ "${{ inputs.BUILD_TYPE }}" = "release" ]; then
            task=assembleRelease
          else
            task=assembleDebug
          fi

          gradle "$task" --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bluejay-recovery-flasher-${{ inputs.BUILD_TYPE || 'debug' }}
          path: flasher/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
