name: Recovery Builder - TWRP

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: "TWRP source branch"
        required: true
        default: "twrp-12.1"
        type: choice
        options:
          - twrp-12.1

      DEVICE_TREE:
        description: "Pixel 6a device-tree repository"
        required: true
        default: "https://github.com/twrpdtgen/android_device_google_bluejay.git"
        type: string

      DEVICE_TREE_BRANCH:
        description: "Existing device-tree branch"
        required: true
        default: "bluejay_beta-user-UpsideDownCake-UPP2.230217.004-9663077-release-keys"
        type: string

permissions:
  contents: read

concurrency:
  group: twrp-bluejay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Experimental TWRP - Pixel 6a
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    defaults:
      run:
        shell: bash

    env:
      MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
      DEVICE_TREE: ${{ inputs.DEVICE_TREE }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
      DEVICE_PATH: device/google/bluejay
      DEVICE_NAME: bluejay

    steps:
      - name: Check out builder repository
        uses: actions/checkout@v5

      - name: Prepare diagnostic directory
        run: |
          set -eo pipefail
          mkdir -p "$GITHUB_WORKSPACE/reports"

          {
            echo "Device: $DEVICE_NAME"
            echo "Manifest: $MANIFEST_URL"
            echo "Manifest branch: $MANIFEST_BRANCH"
            echo "Device tree: $DEVICE_TREE"
            echo "Device-tree branch: $DEVICE_TREE_BRANCH"
            echo
            echo "EXPERIMENTAL — NOT VALIDATED FOR FLASHING"
            echo
            df -h
            free -h
          } | tee "$GITHUB_WORKSPACE/reports/build-info.txt"

      - name: Install build dependencies
        run: |
          set -eo pipefail

          {
            sudo apt-get update

            sudo env DEBIAN_FRONTEND=noninteractive \
              apt-get install -y --no-install-recommends \
                bc bison build-essential ca-certificates \
                ccache cpio curl flex g++-multilib gcc-multilib \
                git git-lfs gnupg gperf \
                lib32ncurses-dev lib32readline-dev lib32z1-dev \
                libelf-dev liblz4-tool libncurses-dev libssl-dev \
                libxml2-utils lzop python3 rsync schedtool \
                squashfs-tools unzip wget xsltproc zip zlib1g-dev

            sudo apt-get clean
          } 2>&1 | tee "$GITHUB_WORKSPACE/reports/dependencies.log"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Install repo tool
        run: |
          set -eo pipefail
          mkdir -p "$HOME/bin"

          curl --fail --show-error --location --retry 3 --output "$HOME/bin/repo" "https://storage.googleapis.com/git-repo-downloads/repo" 2>&1 | tee "$GITHUB_WORKSPACE/reports/install-repo.log"

          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" --version \
            2>&1 | tee -a "$GITHUB_WORKSPACE/reports/install-repo.log"

      - name: Initialize TWRP source
        run: |
          set -eo pipefail

          git config --global user.name "GitHub Actions"
          git config --global user.email \
            "github-actions[bot]@users.noreply.github.com"

          mkdir -p "$GITHUB_WORKSPACE/android-recovery"
          cd "$GITHUB_WORKSPACE/android-recovery"

          repo init \
            --depth=1 \
            -u "$MANIFEST_URL" \
            -b "$MANIFEST_BRANCH" \
            2>&1 | tee "$GITHUB_WORKSPACE/reports/repo-init.log"

      - name: Download TWRP source
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/android-recovery"

          repo sync \
            -c \
            -j2 \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            2>&1 | tee "$GITHUB_WORKSPACE/reports/repo-sync.log"

      - name: Clone Pixel 6a device tree
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/android-recovery"

          if [ -e "$DEVICE_PATH" ]; then
            echo "::error::Device destination already exists: $DEVICE_PATH"
            exit 1
          fi

          git clone \
            --depth=1 \
            --single-branch \
            --branch "$DEVICE_TREE_BRANCH" \
            "$DEVICE_TREE" \
            "$DEVICE_PATH" \
            2>&1 | tee "$GITHUB_WORKSPACE/reports/tree-clone.log"

          git -C "$DEVICE_PATH" lfs pull \
            2>&1 | tee "$GITHUB_WORKSPACE/reports/tree-lfs.log"

          {
            echo
            echo "Device-tree commit:"
            git -C "$DEVICE_PATH" rev-parse HEAD
          } >> "$GITHUB_WORKSPACE/reports/build-info.txt"

      - name: Patch legacy device configuration
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/android-recovery"

          if [ ! -f vendor/twrp/config/common.mk ]; then
            echo "::error::Missing vendor/twrp/config/common.mk."
            exit 1
          fi

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["DEVICE_PATH"])
          device_mk = root / "device.mk"

          if not device_mk.is_file():
              raise SystemExit(f"Missing configuration: {device_mk}")

          pattern = re.compile(
              r"^[ \t]*(?:export[ \t]+)?PRODUCT_STATIC_BOOT_CONTROL_HAL[ \t]*[:+?]?="
          )

          result = []
          skipping = False
          removed = 0
          backslash = chr(92)

          for line in device_mk.read_text().splitlines(keepends=True):
              if not skipping and pattern.match(line):
                  removed += 1
                  skipping = line.rstrip().endswith(backslash)
                  continue

              if skipping:
                  skipping = line.rstrip().endswith(backslash)
                  continue

              result.append(line)

          device_mk.write_text("".join(result))
          print(f"Removed {removed} obsolete boot-control assignment(s).")

          old = "vendor/omni/config/common.mk"
          new = "vendor/twrp/config/common.mk"

          for path in sorted(root.rglob("*.mk")):
              text = path.read_text()
              if old in text:
                  path.write_text(text.replace(old, new))
                  print(f"Updated configuration include: {path}")
          PY

          git -C "$DEVICE_PATH" diff \
            | tee "$GITHUB_WORKSPACE/reports/device-tree-patch.diff"

      - name: Inspect and validate device configuration
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/android-recovery"

          {
            echo "=== Device-tree files ==="
            git -C "$DEVICE_PATH" ls-files

            for name in \
              AndroidProducts.mk \
              BoardConfig.mk \
              device.mk \
              omni_bluejay.mk \
              twrp_bluejay.mk \
              recovery.fstab
            do
              if [ -f "$DEVICE_PATH/$name" ]; then
                echo
                echo "=== $name ==="
                cat "$DEVICE_PATH/$name"
              fi
            done

            echo
            df -h
          } | tee "$GITHUB_WORKSPACE/reports/device-config.txt"

          for required in AndroidProducts.mk BoardConfig.mk; do
            if [ ! -f "$DEVICE_PATH/$required" ]; then
              echo "::error::Missing $DEVICE_PATH/$required"
              exit 1
            fi
          done

          if [ -f "$DEVICE_PATH/twrp_${DEVICE_NAME}.mk" ]; then
            product="twrp_${DEVICE_NAME}"
          elif [ -f "$DEVICE_PATH/omni_${DEVICE_NAME}.mk" ]; then
            product="omni_${DEVICE_NAME}"
          else
            echo "::error::No matching product makefile."
            exit 1
          fi

          echo "DEVICE_PRODUCT=$product" >> "$GITHUB_ENV"

      - name: Select target and build experimental recovery
        run: |
          set -eo pipefail
          cd "$GITHUB_WORKSPACE/android-recovery"

          {
            source build/envsetup.sh
            lunch "${DEVICE_PRODUCT}-eng"

            recovery_as_boot="$(get_build_var BOARD_USES_RECOVERY_AS_BOOT)"
            move_to_vendor="$(get_build_var BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT)"
            include_in_vendor="$(get_build_var BOARD_INCLUDE_RECOVERY_RAMDISK_IN_VENDOR_BOOT)"
            vendor_size="$(get_build_var BOARD_VENDOR_BOOTIMAGE_PARTITION_SIZE)"
            recovery_size="$(get_build_var BOARD_RECOVERYIMAGE_PARTITION_SIZE)"
            no_recovery="$(get_build_var TARGET_NO_RECOVERY)"
            product_out="$(get_build_var PRODUCT_OUT)"

            echo "BOARD_USES_RECOVERY_AS_BOOT=$recovery_as_boot"
            echo "BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT=$move_to_vendor"
            echo "BOARD_INCLUDE_RECOVERY_RAMDISK_IN_VENDOR_BOOT=$include_in_vendor"
            echo "BOARD_VENDOR_BOOTIMAGE_PARTITION_SIZE=$vendor_size"
            echo "BOARD_RECOVERYIMAGE_PARTITION_SIZE=$recovery_size"
            echo "TARGET_NO_RECOVERY=$no_recovery"
            echo "PRODUCT_OUT=$product_out"

            if [ "$move_to_vendor" = "true" ] || \
               [ "$include_in_vendor" = "true" ]; then
              if [ -z "$vendor_size" ] || [ "$vendor_size" = "0" ]; then
                echo "::error::Vendor recovery is enabled but vendor_boot size is missing."
                exit 1
              fi

              target="vendorbootimage"
              image="vendor_boot.img"

            elif [ "$recovery_as_boot" = "true" ]; then
              target="bootimage"
              image="boot.img"

            elif [ "$no_recovery" != "true" ] && \
                 [ -n "$recovery_size" ] && \
                 [ "$recovery_size" != "0" ]; then
              target="recoveryimage"
              image="recovery.img"

            else
              echo "::error::No unambiguous recovery target in this device configuration."
              echo "::error::Inspect BoardConfig.mk; do not force a partition target."
              exit 1
            fi

            if [ -z "$product_out" ]; then
              echo "::error::PRODUCT_OUT is empty."
              exit 1
            fi

            case "$product_out" in
              /*) output_dir="$product_out" ;;
              *) output_dir="$PWD/$product_out" ;;
            esac

            echo "Selected target: $target"
            echo "Expected image: $output_dir/$image"

            echo "BUILT_IMAGE=$image" >> "$GITHUB_ENV"
            echo "BUILT_OUTPUT_DIR=$output_dir" >> "$GITHUB_ENV"

            {
              echo "Selected product: $DEVICE_PRODUCT"
              echo "Selected build target: $target"
              echo "Expected image: $image"
              echo "Output directory: $output_dir"
            } >> "$GITHUB_WORKSPACE/reports/build-info.txt"

            make -j2 "$target"

            if [ ! -s "$output_dir/$image" ]; then
              echo "::error::Target completed without producing $image."
              if [ -d "$output_dir" ]; then
                find "$output_dir" -maxdepth 2 \
                  -type f -name '*.img' -print
              fi
              exit 1
            fi
          } 2>&1 | tee "$GITHUB_WORKSPACE/reports/build.log"

      - name: Collect image
        run: |
          set -eo pipefail

          destination="$GITHUB_WORKSPACE/artifacts"
          source_image="$BUILT_OUTPUT_DIR/$BUILT_IMAGE"

          if [ ! -s "$source_image" ]; then
            echo "::error::Expected image missing: $source_image"
            exit 1
          fi

          mkdir -p "$destination"
          cp "$source_image" "$destination/"
          cp "$GITHUB_WORKSPACE/reports/build-info.txt" "$destination/"
          cp "$GITHUB_WORKSPACE/reports/device-tree-patch.diff" "$destination/"

          {
            echo "EXPERIMENTAL BUILD — NOT VALIDATED FOR FLASHING"
            echo
            echo "Device: Google Pixel 6a / bluejay"
            echo "Target selected from the device-tree configuration."
            echo "Android 16 compatibility has not been established."
            echo "Compilation does not prove bootability or decryption."
            echo "Recovery boot-control HAL support requires validation."
          } > "$destination/READ-ME-FIRST.txt"

          cd "$destination"
          sha256sum "$BUILT_IMAGE" > SHA256SUMS.txt

      - name: Upload experimental image
        uses: actions/upload-artifact@v4
        with:
          name: experimental-twrp-bluejay-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-bluejay-logs-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 7