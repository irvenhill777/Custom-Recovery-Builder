name: Recovery Builder - TWRP

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: "TWRP source branch"
        required: true
        default: "twrp-12.1"
        type: choice
        options:
          - twrp-12.1

      DEVICE_TREE:
        description: "Pixel 6a device-tree repository"
        required: true
        default: "https://github.com/twrpdtgen/android_device_google_bluejay.git"
        type: string

      DEVICE_TREE_BRANCH:
        description: "Existing branch in the device-tree repository"
        required: true
        default: "bluejay_beta-user-UpsideDownCake-UPP2.230217.004-9663077-release-keys"
        type: string

      BUILD_TARGET:
        description: "Experimental image target; must match the device tree"
        required: true
        default: "vendorboot"
        type: choice
        options:
          - vendorboot
          - boot
          - recovery

permissions:
  contents: read

concurrency:
  group: twrp-bluejay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Experimental TWRP - Pixel 6a
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    env:
      MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
      MANIFEST_BRANCH: ${{ inputs.MANIFEST_BRANCH }}
      DEVICE_TREE: ${{ inputs.DEVICE_TREE }}
      DEVICE_TREE_BRANCH: ${{ inputs.DEVICE_TREE_BRANCH }}
      BUILD_TARGET: ${{ inputs.BUILD_TARGET }}
      DEVICE_PATH: device/google/bluejay
      DEVICE_NAME: bluejay

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out builder repository
        uses: actions/checkout@v4

      - name: Prepare report directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/reports"

          {
            echo "Device: $DEVICE_NAME"
            echo "Manifest: $MANIFEST_URL"
            echo "Manifest branch: $MANIFEST_BRANCH"
            echo "Tree: $DEVICE_TREE"
            echo "Tree branch: $DEVICE_TREE_BRANCH"
            echo "Requested target: ${BUILD_TARGET}image"
            echo
            echo "EXPERIMENTAL: Android 16 compatibility is not established."
            echo "Do not flash output without validating the device port."
            echo
            df -h
            free -h
          } | tee "$GITHUB_WORKSPACE/reports/build-info.txt"

      - name: Install build dependencies
        run: |
          set -eo pipefail

          sudo apt-get update

          sudo env DEBIAN_FRONTEND=noninteractive \
            apt-get install -y --no-install-recommends \
              bc \
              bison \
              build-essential \
              ca-certificates \
              ccache \
              cpio \
              curl \
              flex \
              g++-multilib \
              gcc-multilib \
              git \
              git-lfs \
              gnupg \
              gperf \
              lib32ncurses-dev \
              lib32readline-dev \
              lib32z1-dev \
              libelf-dev \
              liblz4-tool \
              libncurses-dev \
              libssl-dev \
              libxml2-utils \
              lzop \
              python3 \
              rsync \
              schedtool \
              squashfs-tools \
              unzip \
              wget \
              xsltproc \
              zip \
              zlib1g-dev \
            2>&1 | tee "$GITHUB_WORKSPACE/reports/dependencies.log"

          sudo apt-get clean

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: Install repo tool
        run: |
          set -eo pipefail

          mkdir -p "$HOME/bin"

          curl --fail --location --r